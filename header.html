<!DOCTYPE html>
<html>
<head>
    <title>Header</title>

    <style>
        body {
            margin: 0;
            background-image: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)), url("citcollege.jpg");
            background-size: cover;
            background-position: left;
            
        }

        h1 {
            text-align: left;
            font-size: 45px;
            font-family: arial;
            margin-left: 120px;
            
            background: linear-gradient(to right, #ff01ea, white, #fbff00);
            -webkit-background-clip: text;

            background-clip: text;
            color: transparent;
        }

        .logo {
            position: absolute;
            top: 10px;
            left: 10px;
            width: 100px;
            height: auto;
        }
        .menu{
            width: 40%;
            float: left;
            height: 100px;
        }

        ul{
            display: flex;
            justify-content: center;
            align-items: center;
        }

        ul li{
            list-style: none;
            margin-left: 60px;
            margin-top: 40px;
            font-size: 30px;
            transition: 0.2s ease-in-out;
        }

        ul li a{
            text-decoration: none;
            color: black;
            font-family: Arial;
            font-weight: bold;

            background: white;
            padding: 10px 20px;
            border-radius: 8px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.5);

            transition: 0.2s ease-out;
        }

        ul li:hover{
            transform: scale(1.4);
        }

        ul li a:hover{
            color:red;
        }
    </style>



</head>

<body>

    <h1>City College of San Jose Del Monte</h1>

    <img src="citycollegelogo.png" class="logo">

</body>
</html>
